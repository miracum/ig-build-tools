name: ci

on:
  push:
    branches: [master]
  release:
    types: [created]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    uses: miracum/.github/.github/workflows/standard-build.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      actions: read
      security-events: write
      artifact-metadata: write
      attestations: write
    with:
      enable-build-test-layer: false
      enable-upload-test-image: false

  lint:
    uses: miracum/.github/.github/workflows/standard-lint.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    with:
      enable-codeql: false
      enable-validate-gradle-wrapper: false

  release:
    uses: miracum/.github/.github/workflows/standard-release.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    needs:
      - build
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      semantic-release-token: ${{ secrets.MIRACUM_BOT_SEMANTIC_RELEASE_TOKEN }}
